<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carnet de Vie Matériel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@700&family=Inter:wght@400;600&display=swap">
<style>
:root{
  --bg:#FFFFFF;--bg-alt:#F5F5FA;--ink:#0B0A14;--text:#0B0A14;--muted:#555570;--border:#E4E4EF;
  --blue:#3524E8;--magenta:#E93BF3;--magenta-text:#C51FD0;--violet:#7B2FF2;
  --ok:#1B8A5A;--ok-bg:#E6F5EE;--warn:#B45309;--warn-bg:#FEF3E2;--crit:#C22F2F;--crit-bg:#FCE9E9;--info-bg:#EAE8FD;
  --grad:linear-gradient(135deg,#3524E8,#E93BF3);
  --card:#FFFFFF;--shadow:0 4px 24px rgba(11,10,20,.06);--shadow-blue:0 8px 24px rgba(53,36,232,.15);
  --r:12px;--rs:8px;
  --ft:'Rockwell','Roboto Slab',Georgia,serif;--fb:'Inter',Calibri,Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B0A14;--bg-alt:#15142A;--text:#F2F1FA;--muted:#A9A8C2;--border:#2A2945;--card:#131226;
  --ok:#4CCB8E;--ok-bg:#0F2E22;--warn:#F0B35B;--warn-bg:#3A2A0F;--crit:#F27A7A;--crit-bg:#3F1616;--info-bg:#221E4D;
  --magenta-text:#F06CF7;--shadow:0 4px 24px rgba(0,0,0,.4);color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0B0A14;--bg-alt:#15142A;--text:#F2F1FA;--muted:#A9A8C2;--border:#2A2945;--card:#131226;
  --ok:#4CCB8E;--ok-bg:#0F2E22;--warn:#F0B35B;--warn-bg:#3A2A0F;--crit:#F27A7A;--crit-bg:#3F1616;--info-bg:#221E4D;
  --magenta-text:#F06CF7;--shadow:0 4px 24px rgba(0,0,0,.4);color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:400 15px/1.5 var(--fb);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--ft);font-weight:700;margin:0;text-wrap:balance;line-height:1.2}
h1{font-size:1.5rem}h2{font-size:1.25rem}h3{font-size:1.05rem}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--magenta-text)}
.num{font-variant-numeric:tabular-nums}

/* Header */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--border)}
.topbar::before{content:"";display:block;height:4px;background:var(--grad)}
.topbar-in{max-width:1180px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:200px}
.brand .mark{width:34px;height:34px;border-radius:9px;background:var(--grad);display:grid;place-items:center;color:#fff;font-family:var(--ft);font-weight:700;font-size:15px;box-shadow:var(--shadow-blue)}
.brand small{display:block;color:var(--muted);font-size:.8rem}
.actions{display:flex;gap:8px;flex-wrap:wrap}
nav.tabs{max-width:1180px;margin:0 auto;padding:0 16px;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;color:var(--muted);font-weight:600;white-space:nowrap;cursor:pointer;display:flex;align-items:center;gap:6px}
nav.tabs button.on{color:var(--text);border-bottom-color:var(--blue)}
nav.tabs button:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.count{background:var(--crit);color:#fff;border-radius:999px;font-size:.7rem;padding:1px 6px;min-width:18px;text-align:center}
.count.warn{background:var(--warn)}
.count.zero{display:none}

main{max-width:1180px;margin:0 auto;padding:20px 16px 48px}
.view{display:grid;gap:20px}

/* Buttons */
.btn{border:1px solid var(--border);background:var(--card);border-radius:var(--rs);padding:8px 14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;line-height:1.2}
.btn:hover{border-color:var(--blue)}
.btn.primary{background:var(--grad);color:#fff;border:0;box-shadow:var(--shadow-blue)}
.btn.ghost{background:transparent;color:var(--blue);border-color:var(--blue)}
.btn.danger{color:var(--crit);border-color:var(--crit)}
.btn.sm{padding:5px 10px;font-size:.85rem}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* Cards & tiles */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none;background:var(--bg-alt)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.tile{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px}
.tile .lbl{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.tile .val{font-family:var(--ft);font-size:1.9rem;line-height:1.1;margin-top:4px}
.tile .val.grad{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.tile .sub{font-size:.8rem;color:var(--muted);margin-top:4px}
.tile.crit{border-color:var(--crit);background:var(--crit-bg)}
.tile.warn{border-color:var(--warn);background:var(--warn-bg)}
.tile.ok{border-color:var(--ok);background:var(--ok-bg)}
.band{background:var(--ink);color:#fff;border-radius:var(--r);padding:22px 24px;display:grid;gap:14px;grid-template-columns:1fr auto;align-items:center}
.band h2{color:#fff;font-size:1.35rem}
.band p{margin:6px 0 0;color:#B0B0C0;max-width:60ch}
.band .promise{display:grid;gap:6px;font-family:var(--ft);font-size:1rem}
.band .promise span{background:linear-gradient(135deg,#8A7DFF,#F06CF7);-webkit-background-clip:text;background-clip:text;color:transparent}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media (max-width:760px){.grid2{grid-template-columns:1fr}.band{grid-template-columns:1fr}}

/* Lists */
.list{display:grid;gap:8px}
.row{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 12px;align-items:center;padding:10px 12px;border:1px solid var(--border);border-radius:var(--rs);background:var(--card)}
.row .stripe{width:6px;align-self:stretch;grid-row:1/3;border-radius:4px;background:var(--border)}
.row.crit .stripe{background:var(--crit)}.row.warn .stripe{background:var(--warn)}.row.ok .stripe{background:var(--ok)}.row.info .stripe{background:var(--blue)}
.row .t{font-weight:600}
.row .d{color:var(--muted);font-size:.85rem}
.row .r{grid-column:2;font-size:.85rem;display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-start;color:var(--muted)}
.row .r .num{margin-right:2px}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:.75rem;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.crit{background:var(--crit-bg);color:var(--crit)}.pill.info{background:var(--info-bg);color:var(--blue)}.pill.muted{background:var(--bg-alt);color:var(--muted)}
.empty{color:var(--muted);padding:18px;text-align:center;border:1px dashed var(--border);border-radius:var(--rs)}

/* Equipment cards */
.eqgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.eq{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:14px;cursor:pointer;display:grid;gap:6px;border-top:3px solid var(--blue)}
.eq:hover{box-shadow:var(--shadow-blue)}
.eq.crit{border-top-color:var(--crit)}.eq.warn{border-top-color:var(--warn)}.eq.ok{border-top-color:var(--ok)}
.eq .cat{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.eq .meta{font-size:.85rem;color:var(--muted)}
.eq .foot{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolbar input,.toolbar select{padding:8px 10px;border:1px solid var(--border);border-radius:var(--rs);background:var(--card)}
.toolbar input{flex:1;min-width:160px}

/* Tables */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th{text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--border)}
td{padding:9px 10px;border-bottom:1px solid var(--border);vertical-align:top}
tr:nth-child(even) td{background:var(--bg-alt)}

/* Forms */
.form{display:grid;gap:12px;grid-template-columns:1fr 1fr}
.form .full{grid-column:1/-1}
.form label{display:grid;gap:4px;font-size:.8rem;color:var(--muted);font-weight:600}
.form input,.form select,.form textarea{padding:9px 10px;border:1px solid var(--border);border-radius:var(--rs);background:var(--card);color:var(--text);width:100%}
.form textarea{min-height:90px;resize:vertical}
@media (max-width:560px){.form{grid-template-columns:1fr}}
.chk{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--border);border-radius:var(--rs);background:var(--card)}
.chk input{width:20px;height:20px;margin-top:2px;accent-color:var(--blue);flex:none}
.chk.auto-bad{border-color:var(--crit);background:var(--crit-bg)}
.chk.auto-warn{border-color:var(--warn);background:var(--warn-bg)}
.chk small{display:block;color:var(--muted)}
.verdict{border-radius:var(--r);padding:18px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.verdict .big{font-family:var(--ft);font-size:2rem}
.verdict.go{background:var(--ok-bg);border:2px solid var(--ok);color:var(--ok)}
.verdict.nogo{background:var(--crit-bg);border:2px solid var(--crit);color:var(--crit)}
.verdict.pending{background:var(--bg-alt);border:2px solid var(--border);color:var(--muted)}
pre.gen{white-space:pre-wrap;background:var(--bg-alt);border:1px solid var(--border);border-radius:var(--rs);padding:12px;font:.85rem/1.5 ui-monospace,Menlo,Consolas,monospace;max-height:320px;overflow:auto}

/* Detail */
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:.9rem}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.section{display:grid;gap:8px}
.section h3{display:flex;justify-content:space-between;align-items:center;gap:8px}
.hist{border-left:2px solid var(--border);padding-left:12px;display:grid;gap:8px;font-size:.88rem}
.hist div b{color:var(--muted);font-weight:600;margin-right:6px;font-variant-numeric:tabular-nums}
.battery{display:flex;align-items:center;gap:10px;font-size:.88rem}
.battery .bar{flex:1;height:8px;background:var(--bg-alt);border-radius:4px;overflow:hidden;border:1px solid var(--border)}
.battery .bar i{display:block;height:100%;background:var(--ok)}
.battery .bar i.warn{background:var(--warn)}.battery .bar i.crit{background:var(--crit)}

/* Modal */
.modal{position:fixed;inset:0;background:rgba(11,10,20,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50;padding:0}
.modal .box{background:var(--bg);width:100%;max-width:820px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px))}
@media (min-width:700px){.modal{align-items:center;padding:20px}.modal .box{border-radius:16px;padding:24px}}
.modal .box>h2{margin-bottom:14px}
.mfoot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:16px;padding-top:12px;border-top:1px solid var(--border)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:var(--rs);font-size:.9rem;z-index:60;box-shadow:var(--shadow);opacity:0;transition:opacity .2s}
.toast.show{opacity:1}
.foot-note{color:var(--muted);font-size:.8rem;text-align:center;margin-top:12px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-in">
    <div class="brand">
      <div class="mark">GE</div>
      <div><h1>Carnet de Vie Matériel</h1><small>Cabinet de géomètres-experts · prototype The French Bot</small></div>
    </div>
    <div class="actions">
      <button class="btn" id="btn-export">Exporter</button>
      <button class="btn primary" id="btn-add">+ Matériel</button>
    </div>
  </div>
  <nav class="tabs" id="tabs"></nav>
</header>
<main><div class="view" id="view"></div></main>
<div id="modal-root"></div>
<div class="toast" id="toast"></div>

<script>
/* ============ Utils ============ */
const KEY='tfb-geo-materiel-v1';
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const todayISO=()=>new Date().toISOString().slice(0,10);
const addDays=(iso,n)=>{const d=new Date(iso+'T00:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
const addMonths=(iso,n)=>{const d=new Date(iso+'T00:00:00');d.setMonth(d.getMonth()+n);return d.toISOString().slice(0,10)};
const daysUntil=iso=>Math.round((new Date(iso+'T00:00:00')-new Date(todayISO()+'T00:00:00'))/86400000);
const fmtD=iso=>iso?new Date(iso+'T00:00:00').toLocaleDateString('fr-FR',{day:'2-digit',month:'short',year:'numeric'}):'—';
const fmtE=n=>(n||0).toLocaleString('fr-FR',{style:'currency',currency:'EUR',maximumFractionDigits:0});
const D=n=>addDays(todayISO(),n);
const M=n=>addMonths(todayISO(),n);

const CATS=['Positionnement','Drone','Scanner 3D','Détection','Accessoires','Informatique','Véhicule','EPI','Logiciel'];
const STATUTS={service:['En service','ok'],maintenance:['En maintenance','warn'],sav:['Au SAV','crit'],hs:['Hors service','crit'],reserve:['En réserve','muted']};
const TEAM=['Marc Delorme (géomètre-expert)','Sophie Ravier (technicienne)','Karim Benali (télépilote)','Léa Fontaine (apprentie)'];

/* ============ Demo data ============ */
function demoData(){
  const eq=(o)=>Object.assign({id:uid(),statut:'service',echeances:[],batteries:[],documents:[],historique:[]},o);
  const ech=(type,derniere,intervalleMois,extra={})=>Object.assign({id:uid(),type,derniere,intervalleMois,prochaine:addMonths(derniere,intervalleMois)},extra);
  const doc=(type,titre,date,extrait={})=>({id:uid(),type,titre,date,extrait});
  const h=(date,texte)=>({date,texte});
  const equipements=[
    eq({nom:'Station totale robotisée',categorie:'Positionnement',marque:'Leica',modele:'TS16 P 1"',serie:'3512877',achat:M(-42),prix:38500,fournisseur:'Leica Geosystems France',affecte:TEAM[0],lieu:'Véhicule 1',
      echeances:[ech('Vérification / étalonnage constructeur',M(-13),12,{obligatoire:true}),ech('Mise à jour firmware Captivate',M(-4),6)],
      batteries:[{id:uid(),ref:'GEB222 n°1',cycles:310,sante:88},{id:uid(),ref:'GEB222 n°2',cycles:295,sante:85},{id:uid(),ref:'GEB222 n°3',cycles:540,sante:61}],
      documents:[doc('Facture','Facture Leica FA-2023-0412',M(-42),{montant:38500,garantie:'24 mois',serie:'3512877'}),doc('Certificat','Certificat de vérification 2025',M(-13),{ecart_angulaire:'0,8"',ecart_distance:'1,2 mm',validite:'12 mois'}),doc('Rapport SAV','Rapport SAV Leica — remplacement compensateur',M(-20),{montant:1250,immobilisation:'21 jours',piece:'Compensateur biaxial'})],
      historique:[h(M(-42),'Achat et mise en service'),h(M(-20),'Retour SAV : compensateur remplacé (21 j)'),h(M(-13),'Vérification constructeur OK — certificat archivé')]}),
    eq({nom:'Récepteur GNSS RTK',categorie:'Positionnement',marque:'Trimble',modele:'R12i',serie:'6231K04512',achat:M(-30),prix:24900,fournisseur:'Geomesure',affecte:TEAM[1],lieu:'Véhicule 2',
      echeances:[ech('Vérification annuelle sur points connus',D(12-365),12,{obligatoire:true}),ech('Abonnement réseau RTK (Orphéon)',D(40-365),12,{cout:1990})],
      batteries:[{id:uid(),ref:'Batterie interne 7,4 V',cycles:410,sante:79}],
      documents:[doc('Facture','Facture Geomesure GM-24-1187',M(-30),{montant:24900,garantie:'36 mois'}),doc('Notice','Manuel utilisateur R12i',M(-30),{})],
      historique:[h(M(-30),'Achat et mise en service'),h(D(12-365),'Contrôle sur 3 points connus : écart max 9 mm')]}),
    eq({nom:'Contrôleur de terrain',categorie:'Informatique',marque:'Trimble',modele:'TSC7',serie:'TSC7-88213',achat:M(-30),prix:5200,fournisseur:'Geomesure',affecte:TEAM[1],lieu:'Véhicule 2',
      echeances:[ech('Renouvellement licence Trimble Access',D(25-365),12,{cout:890})],
      batteries:[{id:uid(),ref:'Pack Li-ion 11,1 V',cycles:520,sante:70}],
      documents:[doc('Rapport SAV','Rapport SAV — remplacement écran',M(-8),{montant:480,immobilisation:'6 jours'})],
      historique:[h(M(-30),'Achat'),h(M(-8),'Écran remplacé après chute (6 j)')]}),
    eq({nom:'Niveau numérique + mire invar 3 m',categorie:'Positionnement',marque:'Leica',modele:'LS15',serie:'LS15-771203',achat:M(-70),prix:9800,fournisseur:'Leica Geosystems France',affecte:TEAM[0],lieu:'Bureau — armoire A',
      echeances:[ech('Contrôle collimation (essai des 2 piquets)',M(-6),12)],
      batteries:[{id:uid(),ref:'GEB222',cycles:180,sante:92}],documents:[doc('Facture','Facture Leica FA-2020-0098',M(-70),{montant:9800})],historique:[h(M(-70),'Achat')]}),
    eq({nom:'Scanner laser 3D',categorie:'Scanner 3D',marque:'Leica',modele:'RTC360',serie:'RTC-3306541',achat:M(-18),prix:62000,fournisseur:'Leica Geosystems France',affecte:TEAM[0],lieu:'Bureau — coffre',
      echeances:[ech('Révision constructeur annuelle',D(90-365),12,{obligatoire:true}),ech('Contrôle nettoyage optique',M(-2),3)],
      batteries:[{id:uid(),ref:'GEB361 n°1',cycles:140,sante:94},{id:uid(),ref:'GEB361 n°2',cycles:150,sante:93}],
      documents:[doc('Facture','Facture Leica FA-2025-0231',M(-18),{montant:62000,garantie:'24 mois'}),doc('Certificat','Certificat calibration usine',M(-18),{})],historique:[h(M(-18),'Achat et formation initiale')]}),
    eq({nom:'Drone photogrammétrie',categorie:'Drone',marque:'DJI',modele:'Mavic 3 Enterprise RTK',serie:'1581F5FJD23A',achat:M(-20),prix:6500,fournisseur:'Drone Volt',affecte:TEAM[2],lieu:'Véhicule 1',
      echeances:[ech('Assurance RC drone (renouvellement)',D(18-365),12,{cout:620,obligatoire:true}),ech('Révision 200 h / hélices + IMU',M(-7),12),ech('Recyclage télépilote (certificat)',M(-50),60,{obligatoire:true})],
      batteries:[{id:uid(),ref:'BWX260 n°1',cycles:118,sante:90},{id:uid(),ref:'BWX260 n°2',cycles:122,sante:88},{id:uid(),ref:'BWX260 n°3',cycles:160,sante:35,hs:true},{id:uid(),ref:'BWX260 n°4',cycles:60,sante:97}],
      documents:[doc('Facture','Facture Drone Volt DV-2025-3341',M(-20),{montant:6500}),doc('Attestation','Attestation assurance RC aérienne',D(18-365),{validite:'12 mois'}),doc('Enregistrement','Enregistrement AlphaTango UAS-FR-0928431',M(-20),{})],
      historique:[h(M(-20),'Achat, enregistrement AlphaTango'),h(M(-7),'Révision 200 h : hélices changées'),h(D(-3),'Batterie n°3 gonflée → mise hors service')]}),
    eq({nom:'Drone LiDAR',categorie:'Drone',marque:'DJI',modele:'Matrice 350 RTK + Zenmuse L2',serie:'1ZNBJ8T0020XXX',achat:M(-9),prix:32000,fournisseur:'Drone Volt',affecte:TEAM[2],lieu:'SAV DJI (Pays-Bas)',statut:'sav',
      echeances:[ech('Assurance RC drone (renouvellement)',M(-9),12,{cout:980,obligatoire:true}),ech('Calibration IMU nacelle L2',M(-9),12)],
      batteries:[{id:uid(),ref:'TB65 n°1',cycles:45,sante:97},{id:uid(),ref:'TB65 n°2',cycles:44,sante:97},{id:uid(),ref:'TB65 n°3',cycles:40,sante:98},{id:uid(),ref:'TB65 n°4',cycles:41,sante:98}],

let S=load();
function load(){try{const r=localStorage.getItem(KEY);if(r){const d=JSON.parse(r);if(d&&d.equipements)return d}}catch(e){}return demoData()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function eqById(id){return S.equipements.find(e=>e.id===id)}
function commit(msg){save();render();if(msg)toast(msg)}

/* ============ Derived ============ */
function echState(e){const d=daysUntil(e.prochaine);return d<0?'crit':d<=30?'warn':'ok'}
function allEch(){return S.equipements.flatMap(eq=>eq.echeances.map(e=>({...e,eq}))).sort((a,b)=>a.prochaine.localeCompare(b.prochaine))}
function openIncidents(){return S.incidents.filter(i=>i.statut==='ouvert')}
function eqState(eq){
  if(eq.statut==='sav'||eq.statut==='hs')return 'crit';
  if(openIncidents().some(i=>i.equipId===eq.id&&i.gravite==='haute'))return 'crit';
  if(eq.echeances.some(e=>echState(e)==='crit'))return 'crit';
  if(eq.statut==='maintenance'||openIncidents().some(i=>i.equipId===eq.id)||eq.echeances.some(e=>echState(e)==='warn')||eq.batteries.some(b=>!b.hs&&b.sante<65))return 'warn';
  return 'ok';
}
function eqProblems(eq){
  const p=[];
  if(eq.statut!=='service')p.push({lvl:'crit',txt:'Statut : '+STATUTS[eq.statut][0]});
  openIncidents().filter(i=>i.equipId===eq.id).forEach(i=>p.push({lvl:i.gravite==='haute'?'crit':'warn',txt:'Incident ouvert : '+i.titre}));
  eq.echeances.forEach(e=>{const s=echState(e);const d=daysUntil(e.prochaine);if(s==='crit')p.push({lvl:'crit',txt:e.type+' en retard de '+(-d)+' j'});else if(s==='warn')p.push({lvl:'warn',txt:e.type+' dans '+d+' j'})});
  eq.batteries.forEach(b=>{if(b.hs)p.push({lvl:'warn',txt:'Batterie HS : '+b.ref});else if(b.sante<65)p.push({lvl:'warn',txt:'Batterie usée : '+b.ref+' ('+b.sante+' %)'})});
  return p;
}
function kpis(){
  const ech=allEch();const year=todayISO().slice(0,4);
  const closYear=S.incidents.filter(i=>i.statut==='clos'&&(i.cloture||'').startsWith(year));
  const immo=closYear.reduce((a,i)=>a+(i.joursImmo||0),0)+openIncidents().filter(i=>i.gravite==='haute').reduce((a,i)=>a-daysUntil(i.date),0);
  const traca=S.equipements.filter(e=>e.documents.some(d=>d.type==='Facture')).length;
  return {
    n:S.equipements.length,valeur:S.equipements.reduce((a,e)=>a+(e.prix||0),0),
    retard:ech.filter(e=>echState(e)==='crit').length,bientot:ech.filter(e=>echState(e)==='warn').length,
    incOuv:openIncidents().length,immo,cout:closYear.reduce((a,i)=>a+(i.cout||0),0),
    dispo:S.equipements.filter(e=>e.statut==='service').length,traca,
    checklists:S.checklists.length
  };
}

const TABS=[['dash','Tableau de bord'],['parc','Parc matériel'],['maint','Maintenance'],['inc','Incidents'],['check','Contrôle avant départ']];

function render(){
  const k=kpis();
  $('#tabs').innerHTML=TABS.map(([id,l])=>{
    let badge='';
    if(id==='maint')badge=`<span class="count ${k.retard?'':'warn'} ${k.retard+k.bientot?'':'zero'}">${k.retard||k.bientot}</span>`;
    if(id==='inc')badge=`<span class="count ${k.incOuv?'':'zero'}">${k.incOuv}</span>`;
    return `<button class="${tab===id?'on':''}" data-tab="${id}">${l}${badge}</button>`}).join('');
  $('#tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render();window.scrollTo(0,0)});
  const v={dash:vDash,parc:vParc,maint:vMaint,inc:vInc,check:vCheck}[tab];
  $('#view').innerHTML=v();
  bind();
}

function echRow(e){
  const st=echState(e);const d=daysUntil(e.prochaine);
  const when=d<0?`En retard de ${-d} j`:d===0?'Aujourd’hui':`Dans ${d} j`;
  return `<div class="row ${st}"><div class="stripe"></div>
    <div><div class="t">${esc(e.type)}</div><div class="d">${esc(e.eq.nom)} · ${esc(e.eq.marque)} ${esc(e.eq.modele)}${e.obligatoire?' · <b>obligatoire</b>':''}${e.cout?' · '+fmtE(e.cout):''}</div></div>
    <div class="r"><span class="num">${fmtD(e.prochaine)}</span>${pill(st,when)}
      <button class="btn sm" data-sav="${e.eq.id}|${e.id}">Demande SAV</button>
      <button class="btn sm ghost" data-done="${e.eq.id}|${e.id}">Fait</button></div></div>`;
}

function vParc(){
  const cats=[...new Set(S.equipements.map(e=>e.categorie))];
  const list=S.equipements.filter(e=>{
    const q=parcFilter.q.toLowerCase();

  const order={crit:0,warn:1,ok:2};list.sort((a,b)=>order[eqState(a)]-order[eqState(b)]||a.categorie.localeCompare(b.categorie));

/* Extraction locale (simulation de ce que Claude fait en production sur le PDF déposé) */
function extractFromText(t){
  const r={};const m=s=>t.match(s);
  let x=m(/(?:total|montant|net à payer)[^\d]{0,30}(\d[\d\s.,]*)\s*€?/i);if(x)r.montant=parseFloat(x[1].replace(/\s/g,'').replace(',','.'))||undefined;
  x=m(/(?:n[°o]\s*(?:de\s*)?s[ée]rie|serial|S\/N)\s*[:#]?\s*([A-Z0-9\-\/]{4,})/i);if(x)r.serie=x[1];
  x=m(/(\d{1,2}[\/.-]\d{1,2}[\/.-]\d{4})/);if(x){const [d,mo,y]=x[1].split(/[\/.-]/);r.date=`${y}-${mo.padStart(2,'0')}-${d.padStart(2,'0')}`}
  x=m(/garantie[^\d]{0,15}(\d+\s*(?:mois|ans?))/i);if(x)r.garantie=x[1];
  x=m(/(?:valid(?:e|ité)|prochain(?:e)?\s*(?:étalonnage|vérification|contrôle))[^\d]{0,30}(\d{1,2}[\/.-]\d{1,2}[\/.-]\d{4}|\d+\s*mois)/i);if(x)r.validite=x[1];
  x=m(/immobilis\w*[^\d]{0,20}(\d+)\s*(?:j|jours)/i);if(x)r.immobilisation=x[1]+' jours';
  x=m(/(?:pi[èe]ce|remplacement)\s*(?:remplacée|de|du|:)?\s*([^\n.,;]{4,50})/i);if(x)r.piece=x[1].trim();
  return r;
}

    if($('#o-ech').checked&&(type==='Certificat'||type==='Rapport SAV'||type==='Attestation')){

    }
    if(type==='Rapport SAV'&&eq.statut==='sav')eq.statut='service';
    eq.historique.unshift({date,texte:type+' archivé : '+titre});
    save();closeModal();render();openDetail(eqId);toast(msg)};
}

/* ============ Incidents ============ */
function openIncident(id){
  const inc=id?S.incidents.find(i=>i.id===id):null;
  const eqOpts=sel=>S.equipements.map(e=>`<option value="${e.id}" ${sel===e.id?'selected':''}>${esc(e.nom)} — ${esc(e.modele)}</option>`).join('');
  if(!inc){
    modal(`<h2>Déclarer un incident</h2><div class="form"><label class="full">Équipement<select id="i-eq">${eqOpts(selectedEq)}</select></label><label class="full">Titre *<input id="i-titre" placeholder="ex : Chute de la station, GNSS ne fixe plus…"></label><label class="full">Description<textarea id="i-desc" placeholder="Circonstances, symptômes, mission impactée…"></textarea></label>
      <label>Gravité<select id="i-grav"><option value="faible">Faible — utilisable</option><option value="moyenne" selected>Moyenne — dégradé</option><option value="haute">Haute — immobilisé</option></select></label><label>Déclarant<select id="i-decl">${TEAM.map(t=>`<option>${esc(t)}</option>`).join('')}</select></label>
      <label class="full chk"><input type="checkbox" id="i-sav"><div>Envoyer au SAV (passe le statut de l’équipement à « Au SAV »)</div></label></div>
      <div class="mfoot"><button class="btn" data-close>Annuler</button><button class="btn primary" id="i-save">Déclarer</button></div>`);
    $('#i-save').onclick=()=>{const titre=$('#i-titre').value.trim();if(!titre){toast('Titre obligatoire');return}
      const eq=eqById($('#i-eq').value);const grav=$('#i-grav').value;const n=S.incidents.length+1;
      S.incidents.unshift({id:uid(),ref:'INC-'+String(n).padStart(4,'0'),equipId:eq.id,date:todayISO(),gravite:grav,titre,description:$('#i-desc').value.trim(),declarant:$('#i-decl').value,statut:'ouvert',actions:'',cloture:null,resolution:'',cout:0,joursImmo:null});
      if($('#i-sav').checked)eq.statut='sav';else if(grav==='haute'&&eq.statut==='service')eq.statut='maintenance';
      eq.historique.unshift({date:todayISO(),texte:'Incident déclaré : '+titre});
      closeModal();tab='inc';commit('Incident enregistré')};
    return;
  }
  const eq=eqById(inc.equipId);const closed=inc.statut==='clos';
  modal(`<h2>${esc(inc.ref)} · ${esc(inc.titre)}</h2>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 12px">${pill(closed?'ok':inc.gravite==='haute'?'crit':'warn',closed?'Clos':'Ouvert')}${pill('muted','gravité '+inc.gravite)}${pill('info',eq?eq.nom:'?')}</div>
    <dl class="kv"><dt>Déclaré le</dt><dd class="num">${fmtD(inc.date)} par ${esc(inc.declarant)}</dd><dt>Description</dt><dd>${esc(inc.description)||'—'}</dd>${closed?`<dt>Clôturé le</dt><dd class="num">${fmtD(inc.cloture)}</dd><dt>Résolution</dt><dd>${esc(inc.resolution)}</dd><dt>Coût</dt><dd class="num">${fmtE(inc.cout)}</dd><dt>Immobilisation</dt><dd class="num">${inc.joursImmo} jour(s)</dd>`:''}</dl>
    ${closed?'':`<div class="form" style="margin-top:14px"><label class="full">Actions en cours<textarea id="i-act">${esc(inc.actions)}</textarea></label>
      <h3 class="full" style="margin-top:6px">Clôturer l’incident</h3>
      <label class="full">Résolution *<textarea id="i-res" placeholder="Ce qui a été fait, par qui, leçon retenue…"></textarea></label>
      <label>Coût (€ HT)<input id="i-cout" type="number" min="0" value="0"></label><label>Jours d’immobilisation<input id="i-immo" type="number" min="0" value="${Math.max(0,-daysUntil(inc.date))}"></label>
      <label>Statut équipement après clôture<select id="i-st">${Object.entries(STATUTS).map(([k,[l]])=>`<option value="${k}" ${k==='service'?'selected':''}>${l}</option>`).join('')}</select></label></div>`}
    <div class="mfoot"><button class="btn" data-close>Fermer</button>${closed?'':'<button class="btn" id="i-upd">Enregistrer les actions</button><button class="btn primary" id="i-close">Clôturer</button>'}</div>`);
  if(!closed){
    $('#i-upd').onclick=()=>{inc.actions=$('#i-act').value.trim();closeModal();commit('Actions enregistrées')};
    $('#i-close').onclick=()=>{const res=$('#i-res').value.trim();if(!res){toast('La résolution est obligatoire : c’est la traçabilité.');return}
      inc.actions=$('#i-act').value.trim();inc.statut='clos';inc.cloture=todayISO();inc.resolution=res;inc.cout=+$('#i-cout').value||0;inc.joursImmo=+$('#i-immo').value||0;
      if(eq){eq.statut=$('#i-st').value;eq.historique.unshift({date:todayISO(),texte:`Incident ${inc.ref} clos : ${res}${inc.cout?' ('+fmtE(inc.cout)+')':''}`})}
      closeModal();commit('Incident clôturé et tracé')};
  }
}

/* ============ Export / Import ============ */
function csvInventaire(){
  const H=['Nom','Catégorie','Marque','Modèle','N° série','Achat','Prix HT','Fournisseur','Affecté à','Localisation','Statut','Prochaine échéance','Type échéance','Incidents ouverts'];
  const q=s=>'"'+String(s??'').replace(/"/g,'""')+'"';
  const rows=S.equipements.map(e=>{const n=[...e.echeances].sort((a,b)=>a.prochaine.localeCompare(b.prochaine))[0];
    return [e.nom,e.categorie,e.marque,e.modele,e.serie,e.achat,e.prix,e.fournisseur,e.affecte,e.lieu,STATUTS[e.statut][0],n?n.prochaine:'',n?n.type:'',openIncidents().filter(i=>i.equipId===e.id).length].map(q).join(';')});
  return '﻿'+[H.map(q).join(';'),...rows].join('\n');
}
function download(name,content,type){try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove()}catch(e){}}
function openExport(){
  const json=JSON.stringify(S,null,2);const csv=csvInventaire();
  modal(`<h2>Exporter / importer</h2><p style="color:var(--muted);margin:0 0 12px">CSV pour Excel (inventaire), JSON pour sauvegarde complète ou migration vers une vraie base.</p>
    <div class="actions" style="margin-bottom:12px"><button class="btn primary" id="x-csv">Télécharger le CSV</button><button class="btn primary" id="x-json">Télécharger le JSON</button><button class="btn" id="x-copycsv">Copier le CSV</button><button class="btn" id="x-copyjson">Copier le JSON</button></div>
    <details><summary style="cursor:pointer;font-weight:600">Aperçu CSV</summary><pre class="gen">${esc(csv.slice(1))}</pre></details>
    <h3 style="margin-top:16px">Importer une sauvegarde JSON</h3><div class="form"><label class="full"><textarea id="x-imp" placeholder="Collez ici un export JSON"></textarea></label></div>
    <div class="mfoot"><button class="btn danger" id="x-reset">Réinitialiser (données de démo)</button><button class="btn" data-close>Fermer</button><button class="btn ghost" id="x-import">Importer</button></div>`);
  $('#x-csv').onclick=()=>{download('inventaire-materiel-'+todayISO()+'.csv',csv,'text/csv;charset=utf-8');toast('CSV généré (si le téléchargement est bloqué, utilisez « Copier »)')};
  $('#x-json').onclick=()=>{download('carnet-de-vie-'+todayISO()+'.json',json,'application/json');toast('JSON généré')};
  $('#x-copycsv').onclick=()=>copy(csv.slice(1));$('#x-copyjson').onclick=()=>copy(json);
  $('#x-import').onclick=()=>{try{const d=JSON.parse($('#x-imp').value);if(!d.equipements||!d.incidents)throw 0;S=d;closeModal();commit('Données importées')}catch(e){toast('JSON invalide')}};
  $('#x-reset').onclick=()=>{if(confirm('Remplacer toutes les données par le jeu de démonstration ?')){S=demoData();closeModal();commit('Données de démo rechargées')}};
}
function copy(t){(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('Copié'),()=>{const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('Copié')}catch(e){toast('Copie impossible')}ta.remove()})}

/* ============ Modal / toast ============ */
function modal(html){
  const r=$('#modal-root');r.innerHTML=`<div class="modal" role="dialog" aria-modal="true"><div class="box">${html}</div></div>`;
  r.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeModal);
  r.querySelector('.modal').onclick=e=>{if(e.target.classList.contains('modal'))closeModal()};
  const first=r.querySelector('input,select,textarea,button');if(first)first.focus();
  document.body.style.overflow='hidden';
}
function closeModal(){$('#modal-root').innerHTML='';document.body.style.overflow=''}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#modal-root').firstChild)closeModal()});
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2600)}

render();
</script>
